[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-backend"
version = "0.1.0"
description = "Parking allocation backend for HR and employees"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "icalendar>=5.0.13"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6"
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["app"]

[tool.setuptools]
packages = ["app"]
