name: Deploy Backend

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment identifier (defaults to base branch or ref)
        required: false
        type: string
      backend-ecr-repository:
        description: ECR repository name for the backend image (defaults to repo variable BACKEND_ECR_REPOSITORY)
        required: false
        type: string
      image-tag:
        description: Custom Docker tag for the backend image (defaults to the commit SHA)
        required: false
        type: string
      cognito-domain-prefix:
        description: Domain prefix for Cognito Hosted UI (defaults to repo variable TF_VAR_COGNITO_DOMAIN_PREFIX or parking-<env>)
        required: false
        type: string
      backend-environment-json:
        description: JSON map with extra environment variables for the backend container
        required: false
        type: string
      allow-ssh-cidr:
        description: Optional CIDR to allow SSH access to the backend instance
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment || (github.event_name == 'pull_request' && github.event.pull_request.base.ref) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build_backend_image:
    name: Build & push backend image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      image_uri: ${{ steps.publish.outputs.image_uri }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_BUILD_ROLE_ARN: ${{ secrets.AWS_BUILD_ROLE_ARN }}
      ECR_REPOSITORY: ${{ github.event.inputs.backend-ecr-repository || vars.BACKEND_ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.event.inputs.image-tag || github.sha }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          missing=0
          for var in AWS_REGION AWS_BUILD_ROLE_ARN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var" >&2
              missing=1
            fi
          done
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ECR repository not configured. Provide workflow input \`backend-ecr-repository\` or set repository variable \`BACKEND_ECR_REPOSITORY\`." >&2
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine deployment environment
        id: context
        shell: python
        env:
          ENV_INPUT: ${{ github.event.inputs.environment || '' }}
        run: |
          import json
          import os
          import re

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          with open(event_path, "r", encoding="utf-8") as fh:
            payload = json.load(fh)

          env_input = os.environ.get("ENV_INPUT", "").strip()
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")

          if env_input:
            target = env_input
          elif event_name == "pull_request":
            target = payload.get("pull_request", {}).get("base", {}).get("ref", "")
          elif event_name == "workflow_dispatch":
            target = ref_name
          else:
            target = ref_name

          target = target.lower()
          target = re.sub(r"[^a-z0-9-]", "-", target)
          target = target.strip("-") or "main"

          print(f"environment={target}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"environment={target}\n")
      - name: Configure AWS credentials (build role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ env.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Retrieve AWS account ID
        id: aws
        shell: bash
        run: |
          account_id=$(aws sts get-caller-identity --query 'Account' --output text)
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build backend image
        shell: bash
        run: |
          IMAGE_URI="${{ steps.aws.outputs.account_id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" backend
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Push backend image
        shell: bash
        run: |
          docker push "$IMAGE_URI"
      - name: Publish image output
        id: publish
        shell: bash
        run: |
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  terraform_apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: build_backend_image
    if: needs.build_backend_image.result == 'success'
    outputs:
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      AWS_INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
      ALLOW_SSH_CIDR_INPUT: ${{ github.event.inputs.allow-ssh-cidr || vars.TF_VAR_ALLOWED_SSH_CIDR }}
      BACKEND_ENV_INPUT: ${{ github.event.inputs.backend-environment-json || vars.TF_VAR_BACKEND_ENVIRONMENT }}
      COGNITO_PREFIX_INPUT: ${{ github.event.inputs['cognito-domain-prefix'] || vars.TF_VAR_COGNITO_DOMAIN_PREFIX }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          missing=0
          for var in AWS_REGION TF_STATE_BUCKET TF_STATE_KEY TF_LOCK_TABLE DB_PASSWORD AWS_INFRA_ROLE_ARN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Terraform variables
        shell: bash
        run: |
          env_name='${{ needs.build_backend_image.outputs.environment }}'
          echo "TF_VAR_environment=$env_name" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_container_image=${{ needs.build_backend_image.outputs.image_uri }}" >> "$GITHUB_ENV"
          echo "TF_VAR_db_password=${DB_PASSWORD}" >> "$GITHUB_ENV"
          if [ -n "$ALLOW_SSH_CIDR_INPUT" ]; then
            echo "TF_VAR_allowed_ssh_cidr=$ALLOW_SSH_CIDR_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$BACKEND_ENV_INPUT" ]; then
            echo "TF_VAR_backend_environment=$BACKEND_ENV_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$COGNITO_PREFIX_INPUT" ]; then
            prefix="$COGNITO_PREFIX_INPUT"
          else
            prefix="parking-$env_name"
          fi
          echo "TF_VAR_cognito_domain_prefix=$prefix" >> "$GITHUB_ENV"
      - name: Configure AWS credentials (infra role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ env.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Compute backend state key
        shell: bash
        run: |
          env_name='${{ needs.build_backend_image.outputs.environment }}'
          key='${TF_STATE_KEY}'
          if [[ "$key" == *"{env}"* ]]; then
            key="${key//\{env\}/$env_name}"
          elif [[ "$key" == *"{environment}"* ]]; then
            key="${key//\{environment\}/$env_name}"
          elif [[ "$key" == *"{ENV}"* ]]; then
            key="${key//\{ENV\}/$env_name}"
          else
            key="$env_name/$key"
          fi
          echo "TF_BACKEND_KEY=$key" >> "$GITHUB_ENV"
      - name: Terraform init
        working-directory: infra
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${AWS_REGION}"
      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan
      - name: Capture Terraform outputs
        id: outputs
        working-directory: infra
        shell: bash
        run: |
          terraform output -json > ../terraform-outputs.json
          if terraform output -raw frontend_bucket >/tmp/bucket 2>/dev/null; then
            echo "frontend_bucket=$(cat /tmp/bucket)" >> "$GITHUB_OUTPUT"
          fi
          if terraform output -raw cloudfront_distribution_id >/tmp/dist 2>/dev/null; then
            echo "cloudfront_distribution_id=$(cat /tmp/dist)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Terraform outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform-outputs.json
          if-no-files-found: error
