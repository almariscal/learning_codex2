name: Deploy AWS stack

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment identifier (overrides the branch name)
        required: false
        type: string
      image-tag:
        description: Custom Docker tag for the backend image (defaults to the commit SHA)
        required: false
        type: string
      backend-ecr-repository:
        description: ECR repository name for the backend image (defaults to repo variable BACKEND_ECR_REPOSITORY)
        required: false
        type: string
      cognito-domain-prefix:
        description: Domain prefix for Cognito Hosted UI (defaults to repo variable TF_VAR_COGNITO_DOMAIN_PREFIX or parking-<env>)
        required: false
        type: string
      backend-environment-json:
        description: JSON map with extra environment variables for the backend container
        required: false
        type: string
      allow-ssh-cidr:
        description: Optional CIDR to allow SSH access to the backend instance
        required: false
        type: string
      cloudfront-invalidation-paths:
        description: Space separated list of paths to invalidate after uploading the frontend (defaults to /*)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  build_backend_image:
    name: Build & Push backend image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      deploy_env: ${{ steps.prepare_env.outputs.value }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ github.event.inputs.backend-ecr-repository || vars.BACKEND_ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.event.inputs.image-tag || github.sha }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "AWS_REGION secret must be configured" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine deploy environment
        id: prepare_env
        shell: bash
        run: |
          env_input="${{ github.event.inputs.environment }}"
          branch="${GITHUB_REF_NAME}"
          if [ -n "$env_input" ]; then
            target="$env_input"
          else
            target="$branch"
          fi
          # sanitise -> lowercase, replace invalid chars with hyphen
          target=$(printf '%s' "$target" | tr '[:upper:]' '[:lower:]')
          target=${target//[^a-z0-9-]/-}
          target=${target##-}
          target=${target%%-}
          if [ -z "$target" ]; then
            target="dev"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"
      - name: Ensure ECR repository provided
        if: env.ECR_REPOSITORY == ''
        run: |
          echo 'ECR repository not configured. Provide workflow input `backend-ecr-repository` or set repository variable `BACKEND_ECR_REPOSITORY`.' >&2
          exit 1
      - name: Configure AWS credentials (build role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Retrieve AWS account ID
        id: aws
        shell: bash
        run: |
          account_id=$(aws sts get-caller-identity --query 'Account' --output text)
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build backend image
        shell: bash
        run: |
          IMAGE_URI="${{ steps.aws.outputs.account_id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" backend
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Push backend image
        shell: bash
        run: |
          docker push "$IMAGE_URI"
      - name: Publish image output
        id: publish
        shell: bash
        run: |
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  apply_infrastructure:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: build_backend_image
    outputs:
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      TF_VAR_environment: ${{ needs.build_backend_image.outputs.deploy_env }}
      TF_VAR_backend_container_image: ${{ needs.build_backend_image.outputs.image_uri }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_infra_role_arn: ${{ secrets.AWS_INFRA_ROLE_ARN }}
      TF_VAR_allowed_ssh_cidr: ${{ github.event.inputs.allow-ssh-cidr || vars.TF_VAR_ALLOWED_SSH_CIDR }}
      AWS_INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for var in TF_STATE_BUCKET TF_STATE_KEY TF_LOCK_TABLE DB_PASSWORD AWS_INFRA_ROLE_ARN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine Cognito domain prefix
        id: cognito
        shell: bash
        run: |
          env_name='${{ needs.build_backend_image.outputs.deploy_env }}'
          prefix_input='${{ github.event.inputs["cognito-domain-prefix"] }}'
          prefix_var='${{ vars.TF_VAR_COGNITO_DOMAIN_PREFIX }}'
          if [ -n "$prefix_input" ]; then
            prefix="$prefix_input"
          elif [ -n "$prefix_var" ]; then
            prefix="$prefix_var"
          else
            prefix="parking-${env_name}"
          fi
          echo "TF_VAR_cognito_domain_prefix=$prefix" >> "$GITHUB_ENV"
      - name: Export optional backend environment map
        shell: bash
        run: |
          value='${{ github.event.inputs.backend-environment-json }}'
          if [ -z "$value" ]; then
            value='${{ vars.TF_VAR_BACKEND_ENVIRONMENT }}'
          fi
          if [ -n "$value" ]; then
            echo "TF_VAR_backend_environment=$value" >> "$GITHUB_ENV"
          fi
      - name: Configure AWS credentials (infra role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"
      - name: Terraform plan
        working-directory: infra
        run: |
          terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve tfplan
      - name: Capture outputs
        id: outputs
        working-directory: infra
        run: |
          bucket=$(terraform output -raw frontend_bucket)
          echo "frontend_bucket=$bucket" >> "$GITHUB_OUTPUT"
          if terraform output -raw cloudfront_distribution_id >/tmp/dist_id 2>/dev/null; then
            dist_id=$(cat /tmp/dist_id)
            echo "cloudfront_distribution_id=$dist_id" >> "$GITHUB_OUTPUT"
          fi

  deploy_frontend:
    name: Upload frontend artefacts
    runs-on: ubuntu-latest
    needs: apply_infrastructure
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FRONTEND_BUCKET: ${{ needs.apply_infrastructure.outputs.frontend_bucket }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ needs.apply_infrastructure.outputs.cloudfront_distribution_id }}
      INVALIDATION_PATHS: ${{ github.event.inputs.cloudfront-invalidation-paths || '/*' }}
    steps:
      - name: Ensure bucket output available
        shell: bash
        run: |
          if [ -z "$FRONTEND_BUCKET" ]; then
            echo "Terraform output frontend_bucket not available" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Configure AWS credentials (build role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync artefacts to S3
        run: |
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}" --delete
      - name: Create CloudFront invalidation
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          read -ra path_array <<< "${INVALIDATION_PATHS:-/*}"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "${path_array[@]}"
