[package]
name = "parking-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for the Parking Allocator app"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tauri = { version = "1.5", features = ["dialog", "dialog-all", "path-all", "shell-open", "window-all"] }
ureq = { version = "2.9", default-features = false, features = ["tls"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
